[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-conflict-owner6"
version = "0.1.0"
description = "Owner 6 result aggregation for clinical VLM conflict experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
owner6-aggregate = "owner6_rigor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
